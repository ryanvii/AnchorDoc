name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AnchorDoc (dev)
        run: pip install -e ".[dev]"
      - name: Run Unit Tests
        run: pytest -v
      - name: Sensitive Information Scan
        run: python3 tools/scan_sensitive.py
