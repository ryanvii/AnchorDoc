[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anchordoc"
version = "0.9.2"
description = "Structured long-PDF retrieval, cross-page evidence localization, quote verification, and auditable numerical recomputation for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ryanvii", email = "ryanwuvii@gmail.com" }]
keywords = ["document-ai", "vectorless-rag", "long-document", "compliance", "auditing", "pdf", "financebench", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pypdfium2>=4.25.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/ryanvii/AnchorDoc"
Repository = "https://github.com/ryanvii/AnchorDoc"
Issues = "https://github.com/ryanvii/AnchorDoc/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
pymupdf = ["pymupdf>=1.24.0"]
mcp = ["mcp>=1.3.0,<2.0.0"]

[project.scripts]
anchordoc = "anchordoc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anchordoc*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
