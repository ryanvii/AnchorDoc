[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anchordoc"
version = "0.1.0"
description = "Zero-index-cost, vectorless document auditing engine for 100-600 page PDFs and long compliance documents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["document-ai", "vectorless-rag", "long-document", "compliance", "auditing", "pdf"]
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pypdfium2>=4.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
pymupdf = ["pymupdf>=1.24.0"]

[project.scripts]
anchordoc = "anchordoc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anchordoc*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
